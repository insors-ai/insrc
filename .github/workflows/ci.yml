name: CI

# Automatic build/test on push/PR is DISABLED — it is irrelevant to the website
# deploy (pages.yml) and its runs (esp. the old 6h-hung + macos-10x jobs) burned
# the org's free Actions minutes, which stalled the Pages deploy. This workflow
# is now manual-only: run it on demand with `gh workflow run ci.yml` (or the
# Actions tab) when you actually want the CI sweep. Local dev still runs
# `npx tsx --test 'src/**/__tests__/*.test.ts'` directly.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Manual validation scope
        type: choice
        options: [backend, runtime-foundation]
        default: backend
      qualification-profile:
        description: Timing profile for runtime-foundation validation only
        type: choice
        options: [normal, slow-vm]
        default: normal

# Supersede an in-flight run when a newer manual run starts, so nothing piles up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ inputs.scope != 'runtime-foundation' }}
    runs-on: ${{ matrix.os }}
    # Hard cap so a leaked native handle (LMDB / Lance / socket) that stops the
    # test process from exiting can't run to GitHub's 6h ceiling again.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only — macos-latest costs 10x minutes and queues for hours.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Install dependencies
        env:
          CXXFLAGS: -std=c++17
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        # --test-force-exit: terminate the runner once tests complete even if a
        # suite leaves a native handle open, instead of hanging. Env-dependent
        # e2e suites gate themselves behind INSRC_LIVE_TESTS and skip here.
        run: npx tsx --test --test-force-exit 'src/**/__tests__/*.test.ts'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  runtime-foundation-windows:
    if: ${{ inputs.scope == 'runtime-foundation' }}
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.qualification-profile == 'slow-vm' && 360 || 240 }}
    permissions:
      contents: read
    env:
      INSRC_BUILD_CONFIRM_CLOSURE: '1'
      INSRC_QUALIFICATION_PROFILE: ${{ inputs.qualification-profile }}
    steps:
      # At most four minutes for SDK setup steps, plus <=30s owned preflight
      # drain, within the five-minute setup/drain envelope. Do not dispatch
      # this job before the separate Windows ownership prerequisite is ready.
      - name: Initialize SDK environment and containment clock
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSRC_QUALIFICATION_PROFILE -notin @('normal', 'slow-vm')) { throw 'Invalid qualification profile' }
          "INSRC_QUALIFICATION_JOB_STARTED_AT_MS=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" >> $env:GITHUB_ENV
          if (-not (Test-Path Env:ONNXRUNTIME_NODE_INSTALL_CUDA)) { 'ONNXRUNTIME_NODE_INSTALL_CUDA=skip' >> $env:GITHUB_ENV }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'Native MSVC tools unavailable' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe
          # Carry only compiler environment fields into later steps.
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(VSCMD|VSINSTALLDIR|VCINSTALLDIR|VCTools|WindowsSdk|WindowsSDK|WindowsLibPath|UniversalCRTSdkDir|UCRTVersion|ExtensionSdkDir|Framework|__VSCMD_)|^(INCLUDE|LIB|LIBPATH)$' } | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
          $env:PATH.Split(';') | Where-Object { $_ } | ForEach-Object { $_ >> $env:GITHUB_PATH }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: '22.22.1'
          architecture: x64
          package-manager-cache: false
      - name: Build and exercise the native foundation in a fresh home
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command cl.exe
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Development Node unavailable' }
          node scripts/qualification-containment.mjs $env:INSRC_QUALIFICATION_JOB_STARTED_AT_MS $env:RUNNER_TEMP windows2025-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime foundation qualification failed' }
      - name: Retain qualification diagnostics
        if: always()
        timeout-minutes: 8
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-foundation-windows-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .insrc/tmp/test-harness/runs/**
            ${{ runner.temp }}/iq-*/result.json
            ${{ runner.temp }}/iq-*/.insrc/tmp/test-harness/runs/**
            ${{ runner.temp }}/iq-*/h/dev/checkouts/*/.insrc/tmp/test-harness/runs/**
            ${{ runner.temp }}/iq-*/h/dev/checkouts/*/.insrc/tmp/dev-preparation/**
            ${{ runner.temp }}/iq-*/h/runtimes/**/completion.json
            ${{ runner.temp }}/iq-*/h/runtimes/**/inventory.json
            ${{ runner.temp }}/iq-*/h/releases/*/.dev-release.json
            ${{ runner.temp }}/iq-*/h/releases/*/inventory.json
