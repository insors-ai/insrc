name: CI

# Automatic build/test on push/PR is DISABLED — it is irrelevant to the website
# deploy (pages.yml) and its runs (esp. the old 6h-hung + macos-10x jobs) burned
# the org's free Actions minutes, which stalled the Pages deploy. This workflow
# is now manual-only: run it on demand with `gh workflow run ci.yml` (or the
# Actions tab) when you actually want the CI sweep. Local dev still runs
# `npx tsx --test 'src/**/__tests__/*.test.ts'` directly.
on:
  workflow_dispatch:

# Supersede an in-flight run when a newer manual run starts, so nothing piles up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # Hard cap so a leaked native handle (LMDB / Lance / socket) that stops the
    # test process from exiting can't run to GitHub's 6h ceiling again.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu only — macos-latest costs 10x minutes and queues for hours.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        # --test-force-exit: terminate the runner once tests complete even if a
        # suite leaves a native handle open, instead of hanging. Env-dependent
        # e2e suites gate themselves behind INSRC_LIVE_TESTS and skip here.
        run: npx tsx --test --test-force-exit 'src/**/__tests__/*.test.ts'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
