# Dedicated build lane for the insrc JetBrains plugin, separate from the TS
# backend's test sweep in ci.yml (the two toolchains stay decoupled, k6).
#
# MANUAL-ONLY (workflow_dispatch): the Kotlin suite is NOT run automatically on
# push/PR — GitHub Actions minutes are expensive and the suite runs locally as
# the real gate (JDK 21 + Gradle 8.10 + the IntelliJ Platform 2024.2 SDK:
#   JAVA_HOME=<jdk21> gradle -p jetbrains-plugin \
#     -Dorg.gradle.java.installations.paths=<jdk21> --no-daemon build verifyPlugin
# ). Trigger this workflow by hand from the Actions tab only when needed.
name: jetbrains-plugin

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # `build` compiles the module, runs the tests, and produces the single
      # plugin distribution artifact (S001 / ac1, ac2, ac3). verifyPlugin runs
      # the IntelliJ Platform plugin-verifier checks over that artifact.
      - name: Build + test the plugin
        run: gradle --no-daemon build verifyPlugin
