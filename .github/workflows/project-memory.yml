name: Project memory qualification

# Manual, package-only qualification; no automatic backend sweep or paid macOS job.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Qualification scope
        type: choice
        options: [full, queue, store-sdk, store-integration]
        default: full

permissions:
  contents: read

concurrency:
  group: project-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Record actual runtime and require ext4
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/memory-evidence"
          {
            git rev-parse HEAD
            node -p 'JSON.stringify(process.versions)'
            uname -a
            for location in "$RUNNER_TEMP" /tmp; do
              findmnt -no SOURCE,FSTYPE,TARGET -T "$location"
              test "$(findmnt -no FSTYPE -T "$location")" = ext4
            done
          } | tee "$RUNNER_TEMP/memory-evidence/platform.log"
          test "${PIPESTATUS[0]}" = 0
      - name: Install independent development dependencies
        shell: bash
        env:
          CXXFLAGS: -std=c++17
        run: |
          cp -R packages/project-memory "$RUNNER_TEMP/project-memory"
          cd "$RUNNER_TEMP/project-memory"
          npm install --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/memory-evidence/install.log"
          npm run build
          npm ls --all --json > "$RUNNER_TEMP/memory-evidence/dependency-graph.json"
          cp package-lock.json "$RUNNER_TEMP/memory-evidence/source-package-lock.json"
      - name: Pack the release and its pre-upgrade baseline
        if: inputs.suite == 'full'
        shell: bash
        env:
          MEMORY_BASELINE: 33eefb2693c64ae393b54ebda479c5dce182d846
          CXXFLAGS: -std=c++17
        run: |
          set -e
          release_dir="$RUNNER_TEMP/memory-evidence/release"
          baseline_dir="$RUNNER_TEMP/memory-evidence/baseline"
          baseline_src="$RUNNER_TEMP/memory-baseline-source"
          mkdir -p "$release_dir" "$baseline_dir" "$baseline_src"
          git fetch --no-tags --depth=1 origin "$MEMORY_BASELINE"
          git archive "$MEMORY_BASELINE" packages/project-memory | tar -x -C "$baseline_src"
          (
            cd "$baseline_src/packages/project-memory"
            npm install --ignore-scripts --no-audit --no-fund
            npm pack --pack-destination "$baseline_dir"
          )
          (
            cd "$RUNNER_TEMP/project-memory"
            npm run --silent pack:release -- "$release_dir" > "$release_dir/pack.json"
          )
      - name: Complete standalone package regression
        if: inputs.suite == 'full'
        shell: bash
        env:
          INSRC_MEMORY_CRASH_EVIDENCE: ${{ runner.temp }}/memory-evidence/queue-crash.json
          INSRC_MEMORY_STORE_PRIMITIVE_EVIDENCE: ${{ runner.temp }}/memory-evidence/store-sdk.json
          INSRC_MEMORY_STORE_INTEGRATION_EVIDENCE: ${{ runner.temp }}/memory-evidence/store-integration.json
          INSRC_MEMORY_PACKAGE_EVIDENCE: ${{ runner.temp }}/memory-evidence/package.json
          INSRC_MEMORY_DEPENDENCY_EVIDENCE: ${{ runner.temp }}/memory-evidence/package-lock.json
          INSRC_MEMORY_PREVIOUS_TARBALL: ${{ runner.temp }}/memory-evidence/baseline/insrc-project-memory-0.1.0.tgz
          INSRC_MEMORY_RELEASE_TARBALL: ${{ runner.temp }}/memory-evidence/release/insrc-project-memory-0.1.0.tgz
        run: |
          cd "$RUNNER_TEMP/project-memory"
          node --import tsx --test --test-concurrency=1 --test-reporter=tap src/__tests__/*.test.ts 2>&1 | tee "$RUNNER_TEMP/memory-evidence/full-package.tap"
      - name: Durable queue and process crash qualification
        if: inputs.suite == 'queue'
        shell: bash
        env:
          INSRC_MEMORY_CRASH_EVIDENCE: ${{ runner.temp }}/memory-evidence/queue-crash.json
        run: |
          cd "$RUNNER_TEMP/project-memory"
          node --import tsx --test --test-reporter=tap src/__tests__/queue-*.test.ts src/__tests__/runtime.test.ts 2>&1 | tee "$RUNNER_TEMP/memory-evidence/queue-suite.tap"
      - name: Native store SDK and process crash qualification
        if: inputs.suite == 'store-sdk' || inputs.suite == 'store-integration'
        shell: bash
        env:
          INSRC_MEMORY_STORE_PRIMITIVE_EVIDENCE: ${{ runner.temp }}/memory-evidence/store-sdk.json
        run: |
          cd "$RUNNER_TEMP/project-memory"
          node --import tsx --test --test-reporter=tap src/__tests__/store-codec.test.ts src/__tests__/store-embedding-profile.test.ts src/__tests__/store-native.test.ts 2>&1 | tee "$RUNNER_TEMP/memory-evidence/store-sdk.tap"
      - name: Production store and real queue process crash integration
        if: inputs.suite == 'store-integration'
        shell: bash
        env:
          INSRC_MEMORY_STORE_INTEGRATION_EVIDENCE: ${{ runner.temp }}/memory-evidence/store-integration.json
        run: |
          cd "$RUNNER_TEMP/project-memory"
          node --import tsx --test --test-concurrency=1 --test-reporter=tap src/__tests__/store-initialization.test.ts src/__tests__/store-guards.test.ts src/__tests__/store-writer.test.ts src/__tests__/store-receipts.test.ts src/__tests__/store-barriers.test.ts src/__tests__/store-reads.test.ts src/__tests__/store-admission.test.ts src/__tests__/store-lifecycle.test.ts src/__tests__/store-crash.test.ts 2>&1 | tee "$RUNNER_TEMP/memory-evidence/store-integration.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-memory-linux-node22-${{ github.sha }}
          path: ${{ runner.temp }}/memory-evidence/
