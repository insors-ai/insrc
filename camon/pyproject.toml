[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camon"
version = "0.1.0"
description = "Passive usage monitor for AI coding agents using mitmproxy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CAMON contributors" }]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "psutil>=5.9",
  "textual>=0.70",
]

[project.optional-dependencies]
proxy = ["mitmproxy>=10"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
camon = "camon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/camon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/camon"]

[[tool.mypy.overrides]]
module = ["psutil", "textual.*"]
ignore_missing_imports = true
