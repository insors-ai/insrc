# --- insrc JetBrains plugin build properties ---

# Plugin coordinates. pluginVersion drives the single Marketplace-updatable
# artifact's version (Story S001 / ac2); bump it to ship an update.
pluginGroup = ai.insors.insrc
pluginVersion = 0.2.5

# Base IntelliJ Platform the plugin compiles against. IntelliJ IDEA Community is
# the reference distribution for the COMMON platform; because the plugin descriptor
# depends only on com.intellij.modules.platform (see META-INF/plugin.xml), the one
# artifact loads in IntelliJ IDEA, PyCharm, GoLand, and WebStorm (Story S001 / lc1).
platformType = IC
platformVersion = 2024.2

# Marketplace/compatibility range for the single artifact (S001 / ac2, ac3).
# Lower bound only: the upper bound is deliberately OPEN-ENDED (unset in
# build.gradle.kts) so the plugin stays forward-compatible across IDE releases —
# it depends only on the stable com.intellij.modules.platform.
pluginSinceBuild = 242

# Toolchain
javaVersion = 21
kotlinVersion = 2.0.21
intellijPlatformGradlePluginVersion = 2.1.0

# Gradle
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
org.gradle.configuration-cache = true
